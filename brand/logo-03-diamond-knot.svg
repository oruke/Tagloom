<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Knot Strand Gradients -->
    <linearGradient id="knot-grad-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="knot-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="knot-grad-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="knot-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="shadow-03" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg-grad-03)" />
  <rect x="12" y="12" width="1000" height="1000" rx="212" fill="none" stroke="#818CF8" stroke-opacity="0.15" stroke-width="6" />

  <!-- Outer Protective Diamond Shield Contour (Subtle Encrypted Boundary) -->
  <polygon points="512,144 880,512 512,880 144,512" fill="none" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="8" stroke-dasharray="16 16" />

  <!-- Four-Fold Woven Diamond Knot Motif -->
  <g filter="url(#shadow-03)">
    <!-- Top Arc Loop -->
    <path d="M 512 216
             C 640 216, 736 312, 736 440
             C 736 568, 640 664, 512 664
             C 384 664, 288 568, 288 440
             C 288 312, 384 216, 512 216 Z"
          fill="none" stroke="url(#knot-grad-top)" stroke-width="64" stroke-linecap="round" />

    <!-- Rotated Interlocking Loops forming Celtic Diamond Weave -->
    <!-- Bottom Arc Loop -->
    <path d="M 512 360
             C 640 360, 736 456, 736 584
             C 736 712, 640 808, 512 808
             C 384 808, 288 712, 288 584
             C 288 456, 384 360, 512 360 Z"
          fill="none" stroke="url(#knot-grad-bottom)" stroke-width="64" stroke-linecap="round" opacity="0.9" />

    <!-- Left Arc Loop -->
    <path d="M 360 512
             C 360 384, 456 288, 584 288
             C 712 288, 808 384, 808 512
             C 808 640, 712 736, 584 736
             C 456 736, 360 640, 360 512 Z"
          fill="none" stroke="url(#knot-grad-left)" stroke-width="64" stroke-linecap="round" opacity="0.85" />

    <!-- Right Arc Loop -->
    <path d="M 216 512
             C 216 384, 312 288, 440 288
             C 568 288, 664 384, 664 512
             C 664 640, 568 736, 440 736
             C 312 736, 216 640, 216 512 Z"
          fill="none" stroke="url(#knot-grad-right)" stroke-width="64" stroke-linecap="round" opacity="0.85" />

    <!-- Central Diamond Nucleus (Encryption Core) -->
    <polygon points="512,440 584,512 512,584 440,512" fill="#111827" stroke="#38BDF8" stroke-width="12" />
    <circle cx="512" cy="512" r="16" fill="#38BDF8" />
  </g>
</svg>
