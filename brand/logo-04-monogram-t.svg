<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-radial-04" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1E38" />
      <stop offset="70%" stop-color="#0D0D1A" />
      <stop offset="100%" stop-color="#070710" />
    </radialGradient>

    <!-- Monogram Gradients -->
    <linearGradient id="t-grad-horizontal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="t-grad-vertical" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <filter id="shadow-04" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg-radial-04)" />
  <rect x="12" y="12" width="1000" height="1000" rx="212" fill="none" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="6" />

  <!-- Ambient Light Backdrop Ring -->
  <circle cx="512" cy="460" r="320" fill="none" stroke="#818CF8" stroke-opacity="0.08" stroke-width="80" filter="blur(20px)" />

  <!-- Monogram T Icon Geometry -->
  <g filter="url(#shadow-04)">
    <!-- Vertical Ribbon Stem of "T" (Tag Needle / Loom Warp Thread) -->
    <path d="M 512 800
             L 512 256
             C 512 212, 476 176, 432 176
             C 388 176, 352 212, 352 256"
          fill="none" stroke="url(#t-grad-vertical)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Horizontal Ribbon Bar of "T" (Weft Thread) -->
    <path d="M 216 344
             L 808 344
             C 852 344, 888 380, 888 424"
          fill="none" stroke="url(#t-grad-horizontal)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Overlap Joint: Vertical Stem weaving OVER the Horizontal Bar -->
    <path d="M 512 280 L 512 408" fill="none" stroke="url(#t-grad-vertical)" stroke-width="84" stroke-linecap="round" />

    <!-- Tag Tag-Hole Dot at Top Left Loop -->
    <circle cx="432" cy="256" r="20" fill="#070710" stroke="#34D399" stroke-width="8" />

    <!-- Tag Pin Anchor Point at Bottom -->
    <circle cx="512" cy="800" r="18" fill="#38BDF8" />
  </g>
</svg>
