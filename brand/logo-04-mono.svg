<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Monochrome T Monogram (Transparent background for tray / favicon / monochrome print) -->
  <g fill="none" stroke="#0284C7">
    <!-- Vertical Ribbon Stem of "T" -->
    <path d="M 512 800
             L 512 256
             C 512 212, 476 176, 432 176
             C 388 176, 352 212, 352 256"
          stroke-width="136" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Horizontal Ribbon Bar of "T" -->
    <path d="M 216 344
             L 808 344
             C 852 344, 888 380, 888 424"
          stroke-width="136" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Tag Hole Dot at Top Left Loop -->
    <circle cx="432" cy="256" r="18" fill="#0284C7" stroke="none" />

    <!-- Tag Pin Anchor Point at Bottom -->
    <circle cx="512" cy="800" r="20" fill="#0284C7" stroke="none" />
  </g>
</svg>
