<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Porcelain White Background Gradient -->
    <linearGradient id="bg-solid-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Deep Royal Blue T Silhouette Gradient -->
    <linearGradient id="t-solid-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>

  <!-- Layer 1: Porcelain White Squircle Base -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg-solid-b)" />

  <!-- Layer 2: Solid Deep Royal Blue T Monogram Silhouette (Fill Geometry, No Stroke) -->
  <g fill="url(#t-solid-b)">
    <!-- Horizontal Ribbon Bar -->
    <rect x="160" y="320" width="704" height="160" rx="80" />

    <!-- Vertical Ribbon Stem -->
    <rect x="432" y="192" width="160" height="640" rx="80" />

    <!-- Woven Interlock Cutout (Vertical Stem Weaving OVER Horizontal Bar) -->
    <rect x="432" y="320" width="160" height="24" fill="#FFFFFF" />
  </g>
</svg>
