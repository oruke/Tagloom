<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06141D" />
      <stop offset="50%" stop-color="#0F2937" />
      <stop offset="100%" stop-color="#051018" />
    </linearGradient>

    <!-- Hash Ribbon Gradient -->
    <linearGradient id="hash-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="hash-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Drop Shadow for layered overlaps -->
    <filter id="shadow-02" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#010408" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg-grad-02)" />
  <rect x="12" y="12" width="1000" height="1000" rx="212" fill="none" stroke="#2DD4BF" stroke-opacity="0.15" stroke-width="6" />

  <!-- Background Decorative Tag Node Elements -->
  <g opacity="0.12" fill="none" stroke="#38BDF8" stroke-width="2">
    <circle cx="512" cy="512" r="320" stroke-dasharray="8 16" />
    <circle cx="512" cy="512" r="220" />
  </g>

  <!-- Reimagined Continuous Woven Hashtag Symbol -->
  <g filter="url(#shadow-02)">
    <!-- Main Hash Grid Structure (Tilted 10 degrees counter-clockwise for dynamic modern feel) -->
    <g transform="rotate(-10 512 512)">
      <!-- Base Underlayer Hash Bars -->
      <!-- Vertical Bar 1 (Left) -->
      <path d="M 372 192 L 372 832" fill="none" stroke="url(#hash-grad-1)" stroke-width="76" stroke-linecap="round" />

      <!-- Vertical Bar 2 (Right) -->
      <path d="M 652 192 L 652 832" fill="none" stroke="url(#hash-grad-1)" stroke-width="76" stroke-linecap="round" />

      <!-- Horizontal Bar 1 (Top) -->
      <path d="M 192 372 L 832 372" fill="none" stroke="url(#hash-grad-2)" stroke-width="76" stroke-linecap="round" />

      <!-- Horizontal Bar 2 (Bottom) -->
      <path d="M 192 652 L 832 652" fill="none" stroke="url(#hash-grad-2)" stroke-width="76" stroke-linecap="round" />

      <!-- Overlap Interlock Caps (Creates woven over/under effect) -->
      <!-- Top-Left Intersection: Vertical Over Horizontal -->
      <path d="M 372 310 L 372 434" fill="none" stroke="url(#hash-grad-1)" stroke-width="76" stroke-linecap="round" />

      <!-- Top-Right Intersection: Horizontal Over Vertical -->
      <path d="M 590 372 L 714 372" fill="none" stroke="url(#hash-grad-2)" stroke-width="76" stroke-linecap="round" />

      <!-- Bottom-Left Intersection: Horizontal Over Vertical -->
      <path d="M 310 652 L 434 652" fill="none" stroke="url(#hash-grad-2)" stroke-width="76" stroke-linecap="round" />

      <!-- Bottom-Right Intersection: Vertical Over Horizontal -->
      <path d="M 652 590 L 652 714" fill="none" stroke="url(#hash-grad-1)" stroke-width="76" stroke-linecap="round" />

      <!-- Center Encrypted Vault Core (Tag Loom Shield Dot) -->
      <rect x="444" y="444" width="136" height="136" rx="28" fill="#06141D" stroke="#2DD4BF" stroke-width="10" />
      <path d="M 512 488 L 512 536 M 488 512 L 536 512" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" />
    </g>
  </g>
</svg>
